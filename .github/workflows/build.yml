name: Build llama.cpp (RTX 5000 / Zen 5)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp git ref to build (branch, tag, or SHA). Leave empty for latest master.'
        required: false
        default: ''
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLAMA_REPO: https://github.com/ggml-org/llama.cpp.git
  BUILD_DIR: llama-src
  ARTIFACT_NAME: llama-cpp-rtx5000-win-x64

jobs:
  build-windows-cuda:
    name: Windows CUDA RTX 5000 (sm_120) - ${{ matrix.compiler }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang]

    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('build-dispatch-{0}-{1}', github.event.inputs.llama_ref, matrix.compiler) || format('build-{0}-{1}', github.ref, matrix.compiler) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout build-pipeline repo
        uses: actions/checkout@v6.0.2

      - name: Resolve llama.cpp ref
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.llama_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "master" }
          Write-Host "Building ref: $ref"
          echo "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Clone llama.cpp @ ${{ steps.resolve.outputs.ref }}
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ steps.resolve.outputs.ref }} `
            ${{ env.LLAMA_REPO }} ${{ env.BUILD_DIR }}

      - name: Record upstream commit
        id: upstream
        shell: pwsh
        run: |
          $sha = git -C ${{ env.BUILD_DIR }} rev-parse HEAD
          $short = $sha.Substring(0,10)
          Write-Host "Upstream SHA: $sha"
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "short=$short" >> $env:GITHUB_OUTPUT

      - name: Cache CUDA Toolkit 13.2.1
        id: cache-cuda
        uses: actions/cache@v5
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2
          key: cuda-13.2.1-redist-v1-windows-2022

      - name: Install CUDA Toolkit 13.2.1 (redist archives)
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2"
          $stage = "$env:RUNNER_TEMP\cuda-redist"
          New-Item -ItemType Directory -Path $cudaPath -Force | Out-Null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $archives = @(
            "cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.2.78-archive.zip",
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.2.75-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.2.78-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.2.78-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-13.4.0.1-archive.zip",
            "libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.2.78-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-13.2.75-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.2.75-archive.zip",
            "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-13.2.75-archive.zip",
            "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.2.75-archive.zip"
          )
          foreach ($a in $archives) {
            $url = "$base/$a"
            $fn = Split-Path -Leaf $a
            $out = Join-Path $stage $fn
            Write-Host "Downloading $fn"
            curl.exe -fsSL -o $out $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
          }
          Get-ChildItem "$stage\*.zip" | ForEach-Object {
            Write-Host "Extracting $($_.Name)"
            Expand-Archive -Path $_.FullName -DestinationPath $stage -Force
          }
          Get-ChildItem -Path $stage -Directory -Filter "*-archive" | ForEach-Object {
            Write-Host "Merging $($_.Name) -> $cudaPath"
            Copy-Item -Path (Join-Path $_.FullName "*") -Destination $cudaPath -Recurse -Force
          }
          Remove-Item -Recurse -Force $stage

      - name: Set CUDA env and verify
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2"
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            Write-Error "nvcc not found at $cudaPath\bin\nvcc.exe"; exit 1
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_PATH_V13_2=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$cudaPath\bin\nvcc.exe" --version

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Clean stale builds
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          cmake -S ${{ env.BUILD_DIR }} -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_CUDA_HOST_COMPILER=cl `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DGGML_CUDA_NCCL=OFF `
            -DCMAKE_CUDA_FLAGS=-w `
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DGGML_AVX_VNNI=ON `
            -DGGML_AVX512=ON -DGGML_AVX512_VBMI=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX512_BF16=OFF `
            -DGGML_NATIVE=OFF `
            -DLLAMA_CPU_AOT_ALWAYS_LOAD=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_APP=OFF `
            -DBUILD_SHARED_LIBS=ON `
            "-DCMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob3 /DNDEBUG" `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob3 /DNDEBUG" `
            "-DCMAKE_C_FLAGS=/arch:AVX512 /Oi /Ot /Gy /fp:precise" `
            "-DCMAKE_CXX_FLAGS=/arch:AVX512 /Oi /Ot /Gy /fp:precise /EHsc"

      - name: Configure (ClangCL)
        if: matrix.compiler == 'clang'
        shell: pwsh
        run: |
          cmake -S ${{ env.BUILD_DIR }} -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_CUDA_HOST_COMPILER=cl `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DGGML_CUDA_NCCL=OFF `
            -DCMAKE_CUDA_FLAGS=-w `
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DGGML_AVX_VNNI=ON `
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF `
            -DGGML_NATIVE=OFF `
            -DLLAMA_CPU_AOT_ALWAYS_LOAD=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_APP=OFF `
            -DBUILD_SHARED_LIBS=ON `
            "-DCMAKE_C_FLAGS_RELEASE=/MD /DNDEBUG" `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MD /DNDEBUG" `
            "-DCMAKE_C_FLAGS=-O3 -march=znver4 -mno-avx512f -mavxvnni -mprefer-vector-width=256 -flto=thin /Gy /Gw -Wno-unused-command-line-argument -Wno-deprecated-declarations" `
            "-DCMAKE_CXX_FLAGS=-O3 -march=znver4 -mno-avx512f -mavxvnni -mprefer-vector-width=256 -flto=thin /Gy /Gw -Wno-unused-command-line-argument -Wno-deprecated-declarations /EHsc" `
            "-DCMAKE_EXE_LINKER_FLAGS=-flto=thin /OPT:REF /OPT:ICF" `
            "-DCMAKE_SHARED_LINKER_FLAGS=-flto=thin /OPT:REF /OPT:ICF"

      - name: Build (Release)
        shell: pwsh
        run: |
          $jobs = [int]$env:NUMBER_OF_PROCESSORS - 1
          if ($jobs -lt 1) { $jobs = 1 }
          cmake --build build --parallel $jobs

      - name: Collect artifacts
        shell: pwsh
        run: |
          $compiler = "${{ matrix.compiler }}"
          $artifactDir = "${{ env.ARTIFACT_NAME }}-$compiler"
          $out = "artifacts\$artifactDir"
          New-Item -ItemType Directory -Path $out -Force
          Copy-Item build\bin\*.exe $out -ErrorAction SilentlyContinue
          Copy-Item build\bin\*.dll $out -ErrorAction SilentlyContinue
          $cudaBin = "$env:CUDA_PATH\bin"
          @("cudart64_*.dll","cublas64_*.dll","cublasLt64_*.dll") | ForEach-Object {
            Copy-Item "$cudaBin\$_" $out -ErrorAction SilentlyContinue
          }
          $cpuFlags = if ($compiler -eq 'msvc') {
            "AVX2, FMA, F16C, AVX_VNNI, AVX-512 (F/BW/CD/DQ/VL), AVX-512 VBMI/VNNI/BF16"
          } else {
            "AVX2, FMA, F16C, AVX_VNNI"
          }
          $compilerName = if ($compiler -eq 'msvc') { "MSVC cl.exe (VS 2022)" } else { "ClangCL (VS 2022 LLVM toolset)" }
          $ltoMode = if ($compiler -eq 'msvc') { "/GL + /LTCG (MSVC LTO)" } else { "ThinLTO (-flto=thin)" }
          @{
            upstream_repo   = "${{ env.LLAMA_REPO }}"
            upstream_ref    = "${{ steps.resolve.outputs.ref }}"
            upstream_sha    = "${{ steps.upstream.outputs.sha }}"
            build_date      = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
            cuda_arch       = "sm_120 (RTX 5000 / Blackwell)"
            cuda_version    = "13.2.1"
            compiler        = $compilerName
            cpu_flags       = $cpuFlags
            lto             = $ltoMode
            flash_attention = "ON"
          } | ConvertTo-Json | Set-Content "$out\build-info.json"
          Write-Host "Artifact contents:"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Package release zip
        shell: pwsh
        run: |
          $artifactDir = "${{ env.ARTIFACT_NAME }}-${{ matrix.compiler }}"
          $zipName = "$artifactDir-${{ steps.upstream.outputs.short }}.zip"
          $zipPath = "artifacts\$zipName"
          Compress-Archive -Path "artifacts\$artifactDir\*" -DestinationPath $zipPath -Force
          Write-Host "Packaged: $zipPath ($([math]::Round((Get-Item $zipPath).Length / 1MB, 1)) MB)"

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.compiler }}-${{ steps.upstream.outputs.short }}
          path: artifacts/${{ env.ARTIFACT_NAME }}-${{ matrix.compiler }}-${{ steps.upstream.outputs.short }}.zip
          retention-days: 30

      - name: Decide release metadata
        id: rel
        shell: pwsh
        run: |
          $ref = "${{ steps.resolve.outputs.ref }}"
          $event = "${{ github.event_name }}"
          $compiler = "${{ matrix.compiler }}"
          $isUpstreamTag = ($ref -ne "master" -and $ref -ne "" -and $event -eq "workflow_dispatch")
          if ($isUpstreamTag) {
            "tag=upstream-$ref-$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "name=llama.cpp upstream $ref ($compiler, sm_120 + Zen 5)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "make_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "make_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create Release
        if: steps.rel.outputs.make_release == 'true'
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          body: |
            Automated build of [llama.cpp](${{ env.LLAMA_REPO }}) @ `${{ steps.upstream.outputs.sha }}`
            Upstream ref: `${{ steps.resolve.outputs.ref }}`
            Compiler: `${{ matrix.compiler }}`

            **Target hardware:** RTX 5000 / 5090 (sm_120) + Zen 5
            **CUDA:** 13.2.1
            **Flash Attention:** Enabled
          files: artifacts/*.zip
          draft: false
          prerelease: false
