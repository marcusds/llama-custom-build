name: Build llama.cpp (RTX 5000 / Zen 5)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp git ref to build (branch, tag, or SHA). Leave empty for latest master.'
        required: false
        default: ''
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLAMA_REPO: https://github.com/ggml-org/llama.cpp.git
  BUILD_DIR: llama-src
  ARTIFACT_NAME: llama-cpp-rtx5000-win-x64

jobs:
  build-windows-cuda:
    name: Windows CUDA RTX 5000 (sm_120) - ${{ matrix.compiler }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang]

    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('build-dispatch-{0}-{1}', github.event.inputs.llama_ref, matrix.compiler) || format('build-{0}-{1}', github.ref, matrix.compiler) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout build-pipeline repo
        uses: actions/checkout@v6.0.2

      - name: Resolve llama.cpp ref
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.llama_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "master" }
          Write-Host "Building ref: $ref"
          echo "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Clone llama.cpp @ ${{ steps.resolve.outputs.ref }}
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ steps.resolve.outputs.ref }} `
            ${{ env.LLAMA_REPO }} ${{ env.BUILD_DIR }}

      - name: Record upstream commit
        id: upstream
        shell: pwsh
        run: |
          $sha = git -C ${{ env.BUILD_DIR }} rev-parse HEAD
          $short = $sha.Substring(0,10)
          Write-Host "Upstream SHA: $sha"
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "short=$short" >> $env:GITHUB_OUTPUT

      - name: Cache CUDA Toolkit 13.2.1
        id: cache-cuda
        uses: actions/cache@v5
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2
          key: cuda-13.2.1-redist-v1-windows-2022

      - name: Install CUDA Toolkit 13.2.1 (redist archives)
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2"
          $stage = "$env:RUNNER_TEMP\cuda-redist"
          New-Item -ItemType Directory -Path $cudaPath -Force | Out-Null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $base = "https://developer.download.nvidia.com/compute/cuda/redist"
          $archives = @(
            "cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.2.78-archive.zip",
            "cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.2.75-archive.zip",
            "cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.2.78-archive.zip",
            "cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-13.2.78-archive.zip",
            "libcublas/windows-x86_64/libcublas-windows-x86_64-13.4.0.1-archive.zip",
            "libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.2.78-archive.zip",
            "cuda_nvtx/windows-x86_64/cuda_nvtx-windows-x86_64-13.2.75-archive.zip",
            "cuda_profiler_api/windows-x86_64/cuda_profiler_api-windows-x86_64-13.2.75-archive.zip",
            "visual_studio_integration/windows-x86_64/visual_studio_integration-windows-x86_64-13.2.75-archive.zip",
            "cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.2.75-archive.zip"
          )
          foreach ($a in $archives) {
            $url = "$base/$a"
            $fn = Split-Path -Leaf $a
            $out = Join-Path $stage $fn
            Write-Host "Downloading $fn"
            curl.exe -fsSL -o $out $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
          }
          Get-ChildItem "$stage\*.zip" | ForEach-Object {
            Write-Host "Extracting $($_.Name)"
            Expand-Archive -Path $_.FullName -DestinationPath $stage -Force
          }
          Get-ChildItem -Path $stage -Directory -Filter "*-archive" | ForEach-Object {
            Write-Host "Merging $($_.Name) -> $cudaPath"
            Copy-Item -Path (Join-Path $_.FullName "*") -Destination $cudaPath -Recurse -Force
          }
          Remove-Item -Recurse -Force $stage

      - name: Set CUDA env and verify
        shell: pwsh
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2"
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            Write-Error "nvcc not found at $cudaPath\bin\nvcc.exe"; exit 1
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_PATH_V13_2=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$cudaPath\bin\nvcc.exe" --version

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Clean stale builds
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          cmake -S ${{ env.BUILD_DIR }} -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_CUDA_HOST_COMPILER=cl `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_FORCE_MMQ=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON -DGGML_CUDA_GRAPHS=ON `
            "-DCMAKE_CUDA_FLAGS=-w -Xptxas=-O3 -Xptxas=-dlcm=ca" `
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DGGML_AVX_VNNI=ON `
            -DGGML_AVX512=ON -DGGML_AVX512_VBMI=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX512_BF16=OFF `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_APP=OFF -DGGML_CCACHE=OFF `
            -DBUILD_SHARED_LIBS=ON `
            "-DCMAKE_C_FLAGS_RELEASE=/MD /O2 /Ob3 /DNDEBUG" `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MD /O2 /Ob3 /DNDEBUG" `
            "-DCMAKE_C_FLAGS=/arch:AVX512 /Oi /Ot /Gy /fp:precise /wd4244 /wd4267 /wd4804 /wd4319" `
            "-DCMAKE_CXX_FLAGS=/arch:AVX512 /Oi /Ot /Gy /fp:precise /EHsc /wd4244 /wd4267 /wd4804 /wd4319"

      - name: Configure (ClangCL)
        if: matrix.compiler == 'clang'
        shell: pwsh
        run: |
          cmake -S ${{ env.BUILD_DIR }} -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_CUDA_HOST_COMPILER=cl `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_FORCE_MMQ=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=ON -DGGML_CUDA_GRAPHS=ON `
            "-DCMAKE_CUDA_FLAGS=-w -Xptxas=-O3 -Xptxas=-dlcm=ca" `
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DGGML_AVX_VNNI=ON `
            -DGGML_AVX512=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_BF16=OFF `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_APP=OFF -DGGML_CCACHE=OFF `
            -DBUILD_SHARED_LIBS=ON `
            "-DCMAKE_C_FLAGS_RELEASE=/MD /DNDEBUG" `
            "-DCMAKE_CXX_FLAGS_RELEASE=/MD /DNDEBUG" `
            "-DCMAKE_C_FLAGS=-O3 -march=znver4 -mno-avx512f -mavxvnni -mprefer-vector-width=256 -flto=thin /Gy /Gw -Wno-unused-command-line-argument -Wno-deprecated-declarations" `
            "-DCMAKE_CXX_FLAGS=-O3 -march=znver4 -mno-avx512f -mavxvnni -mprefer-vector-width=256 -flto=thin /Gy /Gw -Wno-unused-command-line-argument -Wno-deprecated-declarations /EHsc" `
            "-DCMAKE_EXE_LINKER_FLAGS=-flto=thin /OPT:REF /OPT:ICF" `
            "-DCMAKE_SHARED_LINKER_FLAGS=-flto=thin /OPT:REF /OPT:ICF"

      - name: Build (Release)
        shell: pwsh
        run: |
          $jobs = [int]$env:NUMBER_OF_PROCESSORS - 1
          if ($jobs -lt 1) { $jobs = 1 }
          cmake --build build --parallel $jobs

      - name: Collect artifacts
        shell: pwsh
        run: |
          $compiler = "${{ matrix.compiler }}"
          $artifactDir = "${{ env.ARTIFACT_NAME }}-$compiler"
          $out = "artifacts\$artifactDir"
          New-Item -ItemType Directory -Path $out -Force
          Copy-Item build\bin\*.exe $out -ErrorAction SilentlyContinue
          Copy-Item build\bin\*.dll $out -ErrorAction SilentlyContinue
          $cudaBin = "$env:CUDA_PATH\bin"
          @("cudart64_*.dll","cublas64_*.dll","cublasLt64_*.dll") | ForEach-Object {
            Copy-Item "$cudaBin\$_" $out -ErrorAction SilentlyContinue
          }
          $cpuFlags = if ($compiler -eq 'msvc') {
            "AVX2, FMA, F16C, AVX_VNNI, AVX-512 (F/BW/CD/DQ/VL), AVX-512 VBMI/VNNI/BF16"
          } else {
            "AVX2, FMA, F16C, AVX_VNNI"
          }
          $compilerName = if ($compiler -eq 'msvc') { "MSVC cl.exe (VS 2022)" } else { "ClangCL (VS 2022 LLVM toolset)" }
          $ltoMode = if ($compiler -eq 'msvc') { "/GL + /LTCG (MSVC LTO)" } else { "ThinLTO (-flto=thin)" }
          @{
            upstream_repo   = "${{ env.LLAMA_REPO }}"
            upstream_ref    = "${{ steps.resolve.outputs.ref }}"
            upstream_sha    = "${{ steps.upstream.outputs.sha }}"
            build_date      = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
            cuda_arch       = "sm_120 (RTX 5000 / Blackwell)"
            cuda_version    = "13.2.1"
            compiler        = $compilerName
            cpu_flags       = $cpuFlags
            lto             = $ltoMode
            flash_attention = "ON"
          } | ConvertTo-Json | Set-Content "$out\build-info.json"
          Write-Host "Artifact contents:"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Package release zip
        shell: pwsh
        run: |
          $artifactDir = "${{ env.ARTIFACT_NAME }}-${{ matrix.compiler }}"
          $zipName = "$artifactDir-${{ steps.upstream.outputs.short }}.zip"
          $zipPath = "artifacts\$zipName"
          Compress-Archive -Path "artifacts\$artifactDir\*" -DestinationPath $zipPath -Force
          Write-Host "Packaged: $zipPath ($([math]::Round((Get-Item $zipPath).Length / 1MB, 1)) MB)"

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ matrix.compiler }}-${{ steps.upstream.outputs.short }}
          path: artifacts/${{ env.ARTIFACT_NAME }}-${{ matrix.compiler }}-${{ steps.upstream.outputs.short }}.zip
          retention-days: 30

      - name: Decide release metadata
        id: rel
        shell: pwsh
        run: |
          $ref = "${{ steps.resolve.outputs.ref }}"
          $event = "${{ github.event_name }}"
          $isUpstreamTag = ($ref -ne "master" -and $ref -ne "" -and $event -eq "workflow_dispatch")
          if ($isUpstreamTag) {
            "tag=upstream-$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "name=llama.cpp upstream $ref (sm_120 + Zen 5, Apple M4)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "make_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "make_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Create Release
        if: steps.rel.outputs.make_release == 'true'
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          body: |
            Automated build of [llama.cpp](${{ env.LLAMA_REPO }}) @ `${{ steps.upstream.outputs.sha }}`
            Upstream ref: `${{ steps.resolve.outputs.ref }}`

            **Target hardware:** RTX 5000 / 5090 (sm_120) + Zen 5; Apple M4 (Metal)
            **CUDA:** 13.2.1
            **Flash Attention:** Enabled

            Three artifacts per release:
            - `*-msvc-*.zip` -- Windows, MSVC w/ AVX-512 (F/BW/CD/DQ/VL + VBMI/VNNI)
            - `*-clang-*.zip` -- Windows, ClangCL w/ `-march=znver4` + ThinLTO
            - `*-macos-arm64-*.zip` -- macOS, Metal + `-mcpu=apple-m4` (SME2, KleidiAI)
          files: artifacts/*.zip
          draft: false
          prerelease: false
          append_body: false

  # Apple M4 (MacBook Pro Mac16,1: 4P+6E cores, 10-core GPU, 24 GB). GitHub's
  # arm64 macOS runners are an older M-series chip, so GGML_NATIVE would tune
  # for the runner; the CPU target is pinned to -mcpu=apple-m4 instead. That
  # enables the same features GGML_NATIVE finds on the M4 itself (dotprod,
  # i8mm, fp16, bf16, SME/SME2, no non-streaming SVE). The binaries are
  # therefore never run here: SME instructions would SIGILL on the runner.
  build-macos-metal:
    name: macOS Metal Apple M4
    runs-on: macos-15

    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('build-dispatch-{0}-macos', github.event.inputs.llama_ref) || format('build-{0}-macos', github.ref) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

    env:
      MAC_ARTIFACT_NAME: llama-cpp-m4-macos-arm64

    steps:
      - name: Checkout build-pipeline repo
        uses: actions/checkout@v6.0.2

      - name: Resolve llama.cpp ref
        id: resolve
        env:
          INPUT_REF: ${{ github.event.inputs.llama_ref }}
        run: |
          ref="${INPUT_REF:-master}"
          echo "Building ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Clone llama.cpp @ ${{ steps.resolve.outputs.ref }}
        run: |
          git clone --depth 1 --branch "${{ steps.resolve.outputs.ref }}" \
            "$LLAMA_REPO" "$BUILD_DIR"

      - name: Record upstream commit
        id: upstream
        run: |
          sha=$(git -C "$BUILD_DIR" rev-parse HEAD)
          echo "Upstream SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:10}" >> "$GITHUB_OUTPUT"

      # -mcpu=apple-m4 needs Apple clang 17+ (LLVM 19). Use the newest Xcode
      # on the image and fail here, not halfway through the build, if not.
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          clang --version | head -1
          echo 'int main(void){return 0;}' | clang -mcpu=apple-m4 -x c -c -o /dev/null -
          brew list ninja >/dev/null 2>&1 || brew install ninja

      # GGML_CPU_KLEIDIAI   Arm SME2 microkernels for whatever stays on the CPU.
      # BUILD_SHARED_LIBS   ON: the tools share one libggml*/libllama instead of
      #                     each embedding ggml + the Metal shaders (static was
      #                     647 MB unzipped, shared is 32 MB). INSTALL_RPATH
      #                     @loader_path makes the binaries find the dylibs next
      #                     to them wherever the zip is unpacked; the default
      #                     build rpath is the runner's absolute build dir.
      # LLAMA_BUILD_BORINGSSL  TLS linked in statically; otherwise llama-server
      #                     links the runner's Homebrew libssl.dylib and won't
      #                     start on a Mac without that exact version.
      # GGML_OPENMP         OFF: Apple clang has no libomp; ggml's threadpool runs.
      # LLAMA_BUILD_NUMBER  --depth 1 clones report build 1; recover it from bNNNN.
      - name: Configure
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          num=$(printf '%s' "$REF" | sed -n 's/^b\([0-9]\{1,\}\)$/\1/p')
          build_num=()
          [ -n "$num" ] && build_num=(-DLLAMA_BUILD_NUMBER="$num")
          cmake -S "$BUILD_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            "-DCMAKE_C_FLAGS=-mcpu=apple-m4" \
            "-DCMAKE_CXX_FLAGS=-mcpu=apple-m4" \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_RPATH=@loader_path -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DGGML_CCACHE=OFF \
            "${build_num[@]}"

      - name: Build (Release)
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Collect artifacts
        run: |
          out="artifacts/$MAC_ARTIFACT_NAME"
          mkdir -p "$out"
          find build/bin -maxdepth 1 -type f -name 'llama-*' -perm -u+x -exec cp {} "$out" \;
          cp -P build/bin/*.dylib "$out"
          # Every dependency must be the OS or an @rpath dylib shipped in the zip;
          # anything else (e.g. /opt/homebrew, the build dir) breaks on another Mac.
          bad=$(for f in "$out"/*; do
                  [ -L "$f" ] && continue
                  otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r d; do
                    case "$d" in
                      /System/Library/*|/usr/lib/*) ;;
                      @rpath/*) [ -e "$out/${d#@rpath/}" ] || echo "$(basename "$f"): missing $d" ;;
                      *) echo "$(basename "$f"): $d" ;;
                    esac
                  done
                done | sort -u)
          if [ -n "$bad" ]; then echo "Unresolvable dylib dependencies:"; echo "$bad"; exit 1; fi
          jq -n \
            --arg repo "$LLAMA_REPO" \
            --arg ref "${{ steps.resolve.outputs.ref }}" \
            --arg sha "${{ steps.upstream.outputs.sha }}" \
            --arg date "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            --arg compiler "$(clang --version | head -1)" \
            '{upstream_repo: $repo, upstream_ref: $ref, upstream_sha: $sha, build_date: $date,
              gpu: "Metal (embedded library)", cpu_target: "-mcpu=apple-m4 (dotprod, i8mm, fp16, bf16, SME2)",
              kleidiai: "ON", linkage: "shared (@loader_path), static BoringSSL", compiler: $compiler, flash_attention: "ON"}' \
            > "$out/build-info.json"
          ls -l "$out"

      - name: Package release zip
        run: |
          zip_name="$MAC_ARTIFACT_NAME-${{ steps.upstream.outputs.short }}.zip"
          # -y keeps the libfoo.dylib -> libfoo.0.dylib symlinks as symlinks.
          (cd "artifacts/$MAC_ARTIFACT_NAME" && zip -qry "../$zip_name" .)
          ls -lh "artifacts/$zip_name"

      - name: Upload artifacts
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.MAC_ARTIFACT_NAME }}-${{ steps.upstream.outputs.short }}
          path: artifacts/${{ env.MAC_ARTIFACT_NAME }}-${{ steps.upstream.outputs.short }}.zip
          retention-days: 30

      - name: Decide release metadata
        id: rel
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          if [ "$REF" != master ] && [ -n "$REF" ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "tag=upstream-$REF" >> "$GITHUB_OUTPUT"
            echo "name=llama.cpp upstream $REF (sm_120 + Zen 5, Apple M4)" >> "$GITHUB_OUTPUT"
            echo "make_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_release=false" >> "$GITHUB_OUTPUT"
          fi

      # Same name/body as the Windows job: all three jobs write to one release
      # and whichever finishes last sets the text.
      - name: Create Release
        if: steps.rel.outputs.make_release == 'true'
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          body: |
            Automated build of [llama.cpp](${{ env.LLAMA_REPO }}) @ `${{ steps.upstream.outputs.sha }}`
            Upstream ref: `${{ steps.resolve.outputs.ref }}`

            **Target hardware:** RTX 5000 / 5090 (sm_120) + Zen 5; Apple M4 (Metal)
            **CUDA:** 13.2.1
            **Flash Attention:** Enabled

            Three artifacts per release:
            - `*-msvc-*.zip` -- Windows, MSVC w/ AVX-512 (F/BW/CD/DQ/VL + VBMI/VNNI)
            - `*-clang-*.zip` -- Windows, ClangCL w/ `-march=znver4` + ThinLTO
            - `*-macos-arm64-*.zip` -- macOS, Metal + `-mcpu=apple-m4` (SME2, KleidiAI)
          files: artifacts/*.zip
          draft: false
          prerelease: false
          append_body: false
